<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Artwork Details - ArtVista Gallery</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f5f0;
            color: #333;
        }

        /* NAVBAR */

        .navbar {
            background: #2c2c2c;
            padding: 18px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #f4c2c2;
        }

        .cart-count {
            background: #e91e63;
            color: white;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 12px;
        }


        /* ARTWORK SECTION */

        .artwork-container {

            width: 90%;
            max-width: 1100px;

            margin: 60px auto;

            background: white;

            border-radius: 20px;

            padding: 40px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 50px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.1);

        }


        /* IMAGE */

        .artwork-image img {

            width: 100%;

            height: 500px;

            object-fit: cover;

            border-radius: 15px;

        }


        /* DETAILS */

        .artwork-details {

            display: flex;

            flex-direction: column;

            justify-content: center;

        }

        .artwork-details h1 {

            font-size: 40px;

            margin-bottom: 15px;

        }

        .artist {

            color: #777;

            font-size: 18px;

            margin-bottom: 20px;

        }

        .price {

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 25px;

        }

        .description {

            color: #666;

            line-height: 1.7;

            font-size: 16px;

            margin-bottom: 30px;

        }


        /* BUTTONS */

        .cart-button {

            width: 100%;

            padding: 15px;

            background: #e91e63;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;

            cursor: pointer;

            margin-bottom: 15px;

        }

        .cart-button:hover {

            background: #c2185b;

        }

        .back-button {

            display: block;

            text-align: center;

            padding: 13px;

            border: 1px solid #333;

            border-radius: 8px;

            text-decoration: none;

            color: #333;

        }

        .back-button:hover {

            background: #333;

            color: white;

        }


        /* FOOTER */

        .footer {

            background: #2c2c2c;

            color: white;

            text-align: center;

            padding: 30px;

        }


        /* RESPONSIVE */

        @media (max-width: 800px) {

            .artwork-container {

                grid-template-columns: 1fr;

                padding: 25px;

            }

            .artwork-image img {

                height: 350px;

            }

        }


        @media (max-width: 600px) {

            .navbar {

                flex-direction: column;

                gap: 15px;

            }

            .nav-links {

                flex-wrap: wrap;

                justify-content: center;

            }

            .artwork-details h1 {

                font-size: 30px;

            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🎨 ArtVista Gallery
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="gallery.html">Gallery</a>
            </li>

            <li>
                <a href="artists.html">Artists</a>
            </li>

            <li>
                <a href="about.html">About Us</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

            <li>
                <a href="login.html">Login</a>
            </li>

            <li>
                <a href="cart.html">

                    🛒 Cart

                    <span
                        class="cart-count"
                        id="cartCount">
                        0
                    </span>

                </a>
            </li>

        </ul>

    </nav>


    <!-- ARTWORK -->

    <main class="artwork-container">


        <!-- IMAGE -->

        <div class="artwork-image">

            <img
                id="artworkImage"
                src=""
                alt="Artwork">

        </div>


        <!-- DETAILS -->

        <div class="artwork-details">

            <h1 id="artworkTitle">
                Artwork
            </h1>

            <p
                class="artist"
                id="artworkArtist">
            </p>

            <p
                class="price"
                id="artworkPrice">
            </p>

            <p
                class="description"
                id="artworkDescription">
            </p>


            <button
                class="cart-button"
                id="addButton">

                🛒 Add to Cart

            </button>


            <a
                href="gallery.html"
                class="back-button">

                ← Back to Gallery

            </a>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <h2>
            ArtVista Gallery
        </h2>

        <p>
            © 2026 ArtVista Gallery. All Rights Reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        /* ARTWORK DATA */

        const artworks = {

            sunset: {

                title: "Sunset Dreams",

                artist: "Ananya",

                price: 2500,

                image:
                "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5",

                description:
                "Sunset Dreams is a beautiful artwork inspired by the peaceful colors of a sunset. The warm tones and artistic composition create a calm and relaxing atmosphere."

            },


            floral: {

                title: "Floral Beauty",

                artist: "Riya",

                price: 3200,

                image:
                "https://images.unsplash.com/photo-1577083552431-6e5fd01aa342",

                description:
                "Floral Beauty captures the elegance and natural beauty of flowers. The artwork uses vibrant colors to create a fresh and cheerful visual experience."

            },


            mountain: {

                title: "Mountain View",

                artist: "Arjun",

                price: 4000,

                image:
                "https://images.unsplash.com/photo-1549490349-8643362247b5",

                description:
                "Mountain View presents a peaceful landscape surrounded by majestic mountains. It represents the beauty and calmness of nature."

            },


            starry: {

                title: "Starry Night",

                artist: "Meera",

                price: 3500,

                image:
                "https://images.unsplash.com/photo-1541961017774-22349e4a1262",

                description:
                "Starry Night is a creative interpretation of a peaceful night sky. The artwork combines deep colors and artistic textures to create a dreamy atmosphere."

            },


            butterfly: {

                title: "Butterfly Garden",

                artist: "Kavya",

                price: 2800,

                image:
                "https://images.unsplash.com/photo-1518005020951-eccb494ad742",

                description:
                "Butterfly Garden celebrates nature through colorful artistic elements. The artwork represents freedom, beauty and transformation."

            },


            abstract: {

                title: "Abstract Emotions",

                artist: "Rahul",

                price: 4500,

                image:
                "https://images.unsplash.com/photo-1547891654-e66ed7ebb968",

                description:
                "Abstract Emotions uses shapes, colors and textures to express feelings and imagination. It allows viewers to create their own interpretation."

            }

        };


        /* GET ARTWORK ID */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const artworkId =
            urlParams.get("id");


        /* GET SELECTED ARTWORK */

        const artwork =
            artworks[artworkId];


        /* DISPLAY ARTWORK */

        if (artwork) {

            document.getElementById(
                "artworkImage"
            ).src = artwork.image;


            document.getElementById(
                "artworkTitle"
            ).innerText = artwork.title;


            document.getElementById(
                "artworkArtist"
            ).innerText =
                "🎨 Created by " +
                artwork.artist;


            document.getElementById(
                "artworkPrice"
            ).innerText =
                "₹" +
                artwork.price.toLocaleString("en-IN");


            document.getElementById(
                "artworkDescription"
            ).innerText =
                artwork.description;


            document.getElementById(
                "addButton"
            ).onclick = function() {

                addToCart(

                    artworkId,

                    artwork.title,

                    artwork.artist,

                    artwork.price,

                    artwork.image

                );

            };

        }


        /* ADD TO CART */

        function addToCart(
            id,
            title,
            artist,
            price,
            image
        ) {

            let cart =
                JSON.parse(
                    localStorage.getItem(
                        "artvistaCart"
                    )
                ) || [];


            let existing =
                cart.find(
                    item =>
                        item.id === id
                );


            if (existing) {

                existing.quantity++;

            } else {

                cart.push({

                    id: id,

                    title: title,

                    artist: artist,

                    price: price,

                    image: image,

                    quantity: 1

                });

            }


            localStorage.setItem(
                "artvistaCart",
                JSON.stringify(cart)
            );


            updateCartCount();


            alert(
                title +
                " has been added to your cart!"
            );

        }


        /* CART COUNT */

        function updateCartCount() {

            let cart =
                JSON.parse(
                    localStorage.getItem(
                        "artvistaCart"
                    )
                ) || [];


            let count =
                cart.reduce(
                    (total, item) =>
                        total + item.quantity,
                    0
                );


            document.getElementById(
                "cartCount"
            ).innerText = count;

        }


        updateCartCount();

    </script>

</body>

</html>
